<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050812">
  <title>Edit Profile • SparkSocial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="editProfile" class="app">
  <main class="container">
    <h1 class="page-title">Edit profile</h1>
    <p class="page-subtitle">Make your SparkSocial identity yours.</p>
    <form id="editForm" class="composer">
      <div class="field">
        <label for="name">Display name</label>
        <input id="name" maxlength="60" required autocomplete="name">
      </div>
      <div class="field">
        <label for="bio">Bio</label>
        <textarea id="bio" maxlength="160" placeholder="Tell people about yourself"></textarea>
      </div>
      <button id="save" class="primary" type="submit">Save changes</button>
      <div id="status" class="muted" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
