<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SparkSocial Create</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="create-body">


<div class="create-page">



<div class="create-header">

<h1>
⚡ Create
</h1>

<p>
Share ideas, create moments, and connect with the SparkSocial community.
</p>

</div>





<div class="create-options">


<div class="create-option">

<div>
📝
</div>

<p>
Post
</p>

</div>



<div class="create-option">

<div>
📸
</div>

<p>
Media
</p>

</div>




<div class="create-option">

<div>
🔴
</div>

<p>
Live
</p>

</div>




<div class="create-option">

<div>
🛒
</div>

<p>
Market
</p>

</div>




<div class="create-option">

<div>
👥
</div>

<p>
Community
</p>

</div>


</div>






<div class="create-card">


<div class="creator-icon">

✨

</div>



<textarea

id="createContent"

placeholder="What's sparking in your mind today?">

</textarea>



<button id="createPostBtn" class="create-post-btn">

🚀 Share Post

</button>


</div>








<div class="live-create-card">


<div>

<h2>
🔴 Go Live
</h2>


<p>
Start a live session and connect with your audience instantly.
</p>

</div>




<button id="goLiveBtn">

🎥 Start Live

</button>



</div>








<div class="creator-impact-card">


<h2>
⚡ Creator Impact
</h2>


<div class="impact-grid">


<div>

<h3 id="creatorPosts">
0
</h3>

<p>

</p>

</div>



<div>

<h3 id="creatorFollowers">
0
</h3>

<p>
Followers
</p>

</div>



<div>

<h3 id="creatorXP">
0
</h3>

<p>
XP
</p>

</div>


</div>


</div>





</div>




<script type="module" src="create.js"></script>

</html>
