<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050812">
  <title>Home • SparkSocial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home" class="app">
  <header class="topbar">
    <a class="brand" href="home.html"><span>⚡</span> SparkSocial</a>
    <div class="top-actions">
      <a class="icon-btn" href="notifications.html" aria-label="Notifications">🔔</a>
    </div>
  </header>

  <main class="container">
    <section class="section home-heading">
      <div class="eyebrow">⚡ YOUR SPARK SPACE</div>
      <h1 class="page-title" id="welcome">Welcome back.</h1>
      <p class="page-subtitle">See what your community is creating today.</p>
    </section>

    <section class="composer">
      <div class="composer-row">
        <div id="composerAvatar" class="avatar">S</div>
        <form id="postForm" class="composer-form">
          <textarea id="postText" maxlength="2000" placeholder="What's sparking your mind?" required></textarea>
          <div class="composer-bottom">
            <span id="postCount" class="muted">0 / 2000</span>
            <button id="postSubmit" class="primary" type="submit">⚡ Share Spark</button>
          </div>
        </form>
      </div>
    </section>

    <section class="section feed-section">
      <div class="section-heading">
        <div>
          <div class="eyebrow">COMMUNITY</div>
          <h2 class="section-title">For You</h2>
        </div>
        <a class="text-link" href="discover.html">Discover →</a>
      </div>
      <div id="feed" class="feed" aria-live="polite"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <a href="home.html" class="nav-item is-active"><span>⌂</span><small>Home</small></a>
    <a href="discover.html" class="nav-item"><span>✦</span><small>Discover</small></a>
    <a href="create.html" class="nav-create" aria-label="Create Spark">＋</a>
    <a href="messages.html" class="nav-item"><span>◇</span><small>Messages</small></a>
    <a href="profile.html" class="nav-item"><span>○</span><small>Profile</small></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
