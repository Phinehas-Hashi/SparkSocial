<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080B14">
    <meta name="description" content="SparkSocial home feed">
    <title>Home • SparkSocial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-body">

    <header class="topbar" aria-label="SparkSocial header">
        <a class="logo" href="home.html" aria-label="SparkSocial home">⚡ SparkSocial</a>

        <div class="top-icons">
            <button id="notificationBtn" type="button" aria-label="Notifications" title="Notifications">
                🔔
                <span id="notificationBadge" class="notification-badge" hidden>0</span>
            </button>
        </div>
    </header>

    <main class="feed-container">
        <section class="home-intro" aria-labelledby="homeTitle">
            <p class="eyebrow">YOUR SPARK</p>
            <h1 id="homeTitle">Good to see you.</h1>
            <p id="homeSubtitle">Share something with your community.</p>
        </section>

        <section class="create-post" aria-labelledby="createPostTitle">
            <div class="composer-heading">
                <div id="composerAvatar" class="post-avatar" aria-hidden="true">S</div>
                <div>
                    <h2 id="createPostTitle">Create a post</h2>
                    <p>What’s sparking your mind?</p>
                </div>
            </div>

            <label class="sr-only" for="postContent">Post content</label>
            <textarea
                id="postContent"
                maxlength="2000"
                rows="4"
                placeholder="Share an idea, moment, question, or spark..."
                autocomplete="off"></textarea>

            <div class="composer-footer">
                <span id="postCounter" class="character-count">0 / 2000</span>
                <button id="postBtn" class="primary-btn" type="button">
                    <span>Share spark</span>
                    <span aria-hidden="true">⚡</span>
                </button>
            </div>
        </section>

        <section class="feed-section" aria-labelledby="feedTitle">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">COMMUNITY</p>
                    <h2 id="feedTitle">Latest sparks</h2>
                </div>
            </div>

            <div id="feed" aria-live="polite">
                <div class="feed-state" id="feedLoading">Loading your feed…</div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
        <a class="nav-item is-active" href="home.html" aria-current="page">
            <span aria-hidden="true">⌂</span>
            <small>Home</small>
        </a>
        <a class="nav-item" href="discover.html">
            <span aria-hidden="true">◉</span>
            <small>Discover</small>
        </a>
        <a class="nav-item nav-create" href="create.html" aria-label="Create">
            <span aria-hidden="true">＋</span>
        </a>
        <a class="nav-item" href="messages.html">
            <span aria-hidden="true">◇</span>
            <small>Messages</small>
        </a>
        <a class="nav-item" href="profile.html">
            <span aria-hidden="true">○</span>
            <small>Profile</small>
        </a>
    </nav>

    <script type="module" src="home.js"></script>
</body>
</html>
