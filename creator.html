<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creator Hub - Lovena</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="creator-body">


<div class="creator-page">



<div class="creator-header">

<h1>
⚡ Creator Hub
</h1>

<p>
Grow your audience, unlock achievements and become a top creator.
</p>

</div>





<!-- LEVEL -->

<div class="creator-card">


<h2>
🌟 Creator Level
</h2>


<h3 id="creatorLevel">
Level 1
</h3>


<p id="creatorXP">
50 XP / 100 XP
</p>


<div class="xp-bar">

<div id="xpProgress"></div>

</div>


</div>







<!-- BADGES -->

<div class="creator-card">


<h2>
🏆 Badges
</h2>


<div id="badgesList">

No badges earned yet

</div>


</div>







<!-- LIVE ELIGIBILITY -->

<div class="creator-card">


<h2>
🔴 Live Eligibility
</h2>


<p id="liveRegion">
Region: Loading...
</p>


<p id="liveFollowers">
Followers: Loading...
</p>


<p id="liveLevel">
Level: Loading...
</p>



<h3 id="liveStatus">
Checking status...
</h3>


</div>






</div>



<script type="module" src="creator.js"></script>


</body>

</html>
