<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>⚡ SparkSocial | Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

    <img
        src="⚡ SparkSocial.jpg"
        alt="⚡ SparkSocial Logo"
        class="auth-logo">

    <h1>Join ⚡ SparkSocial</h1>

<p class="auth-subtitle">
Connect, create, share, and discover amazing people around the world.
</p>

    <form id="signupForm">

        <input
    id="fullName"
    type="text"
    placeholder="Your full name"
    required>

        <input
    id="email"
    type="email"
    placeholder="Enter your email"
    required>

        <input
    id="password"
    type="password"
    placeholder="Create a secure password"
    required>

        <button
            class="primary-btn"
            type="submit">

            Create My Account

        </button>

    </form>

    <p class="switch-page">

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </p>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
