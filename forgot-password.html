<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030612">
  <title>SparkSocial | Reset Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="spark-theme.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="resetTitle">
      <header class="auth-brand">
        <div class="auth-logo" aria-hidden="true">⚡</div>
        <h1 class="spark-brand">SparkSocial</h1>
        <p>Connect · Create · Grow</p>
      </header>
      <div class="auth-heading">
        <span class="auth-kicker">ACCOUNT RECOVERY</span>
        <h2 id="resetTitle" class="auth-title">Reset your password.</h2>
        <p class="auth-subtitle">Enter your email and we'll send you a secure password-reset link.</p>
      </div>
      <form id="resetForm" class="auth-form" novalidate>
        <label class="auth-field">
          <span>Email address</span>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254">
        </label>
        <p id="resetMessage" class="auth-message" hidden role="status"></p>
        <p id="resetError" class="auth-error" hidden role="alert"></p>
        <button id="resetButton" class="auth-submit" type="submit"><span class="button-label">Send Reset Link</span><span class="button-arrow">→</span></button>
      </form>
      <a class="auth-secondary-button" href="login.html">Back to sign in</a>
    </section>
  </main>
  <script type="module" src="forgot-password.js"></script>
</body>
</html>
