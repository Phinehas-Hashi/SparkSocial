<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SparkSocial | Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

    <img
        src="⚡ SparkSocial.jpg"
        alt="⚡ SparkSocial Logo"
        class="auth-logo">

    <h1>Welcome Back</h1>

<p class="auth-subtitle">
    Ignite your connections.
    Sign in to SparkSocial.
</p>

    <form id="loginForm">

        <input
            id="email"
            type="email"
            placeholder="Email Address"
            required>

        <input
            id="password"
            type="password"
            placeholder="Password"
            required>

        <button
            class="primary-btn"
            type="submit">

            Continue

        </button>

    </form>

    <p class="switch-page">

        New to SparkSocial?

        <a href="signup.html">

            Sign Up

        </a>

    </p>

</div>


</body>
</html>
