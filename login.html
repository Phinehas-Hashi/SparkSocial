<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030612">
  <title>⚡ SparkSocial | Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="spark-theme.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <header class="auth-brand">
        <h1 class="spark-brand"><span class="spark-mark">⚡</span>SparkSocial</h1>
        <p>Connect · Create · Grow</p>
      </header>

      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-subtitle">Sign in and keep your connections glowing.</p>

      <form id="loginForm" class="auth-form" novalidate>
        <label class="auth-field">
          <input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" required>
        </label>
        <label class="auth-field">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
        </label>
        <p id="loginError" class="auth-error" hidden role="alert"></p>
        <button id="loginButton" class="auth-submit" type="submit">Sign In <span>→</span></button>
      </form>

      <p class="auth-switch">New to SparkSocial? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
