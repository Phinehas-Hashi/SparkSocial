<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ SparkSocial | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-container">
    <img src="⚡ SparkSocial.jpg" alt="⚡ SparkSocial Logo" class="auth-logo">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Ignite your connections. Sign in to SparkSocial.</p>

    <form id="loginForm" novalidate>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="Email Address" required>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
        <p id="loginError" class="auth-error" hidden role="alert"></p>
        <button id="loginButton" class="primary-btn" type="submit">Continue</button>
    </form>

    <p class="switch-page">New to SparkSocial? <a href="signup.html">Sign Up</a></p>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
