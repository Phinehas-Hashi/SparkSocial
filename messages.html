<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050812">
  <title>Messages • SparkSocial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="messages" class="app">
  <main class="container">
    <h1 class="page-title">Messages</h1>
    <p class="page-subtitle">Private conversations with your people.</p>
    <section id="conversationList" class="list"></section>
    <section id="chatPanel" class="card hide chat-panel">
      <div class="post-head">
        <div>
          <strong id="chatName">Conversation</strong>
          <div id="chatStatus" class="muted">Private chat</div>
        </div>
        <button id="closeChat" class="pill" type="button">Close</button>
      </div>
      <div id="chatBox" class="chat-box"></div>
      <form id="messageForm" class="comment-form">
        <input id="messageInput" maxlength="2000" placeholder="Write a message…" autocomplete="off">
        <button type="submit" aria-label="Send message">➤</button>
      </form>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
