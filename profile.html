<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - Lovena</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="profile-body">


<div class="profile">


<!-- TOP BAR -->

<div class="profile-topbar">

<h2>
⚡ Profile
</h2>

<button id="menuBtn">
☰
</button>

</div>




<!-- MENU -->

<div id="menuDropdown" class="menu-dropdown">

<a href="settings.html">⚙️ Settings</a>

<a href="faq.html">❓ Help Center</a>

<a href="about.html">⚡ About Lovena</a>

<a href="terms.html">📜 Terms</a>

<a href="privacy.html">🔒 Privacy</a>

<a href="#" id="logoutBtn">🚪 Logout</a>

</div>





<!-- PROFILE CARD -->

<div class="profile-card">


<div class="profile-avatar">
⚡
</div>



<div class="profile-info">

<h1 id="profileName">
Loading...
</h1>


<p id="profileUsername">
@username
</p>


<p id="profileBio">
Your Lovena story begins here.
</p>


</div>


</div>







<!-- EDIT -->

<div class="profile-actions">


<button id="editProfileBtn">
✏️ Edit Profile
</button>



<div id="editProfileBox" style="display:none;">


<input id="editName" placeholder="Full name">

<input id="editUsername" placeholder="Username">

<textarea id="editBio" placeholder="Bio"></textarea>


<button id="saveProfileBtn">
💾 Save Changes
</button>


<button id="cancelEditBtn">
✖️ Cancel
</button>


</div>


</div>







<!-- STATS -->

<div class="profile-stats">


<div id="followersBox">

<h3 id="followersCount">
0
</h3>

<p>
Followers
</p>

</div>



<div id="followingBox">

<h3 id="followingCount">
0
</h3>

<p>
Following
</p>

</div>




<div>

<h3 id="postsCount">
0
</h3>

<p>
Posts
</p>

</div>


</div>








<!-- CREATOR LEVEL -->

<div class="creator-level">

<h2 id="creatorLevel">
⚡ Spark Creator Level 1
</h2>


<p id="creatorXP">
50 XP / 100 XP
</p>


<div class="xp-bar">

<div id="xpProgress"></div>

</div>


</div>







<!-- CREATOR HUB ENTRY -->

<div class="creator-preview"
onclick="location.href='creator.html'">


<div>

<h2>
🚀 Creator Hub
</h2>


<p>
View badges, live eligibility and creator progress.
</p>

</div>


<span>
➜
</span>


</div>








<!-- POSTS -->

<div class="my-posts">


<h2>
📝 My Posts
</h2>


<div id="myPosts">

</div>


</div>




</div>




<script type="module" src="profile.js"></script>


</body>

</html>
